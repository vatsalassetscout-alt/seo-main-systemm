<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEO Management System</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Applied synchronously, before first paint, so there is never a flash
      // of the wrong theme. This is a few bytes of inline JS with no network
      // cost and no effect on page-load performance.
      (function () {
        try {
          // Default theme is dark unless the person has explicitly chosen
          // light before (saved in localStorage).
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : true;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
